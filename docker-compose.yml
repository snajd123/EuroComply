version: '3.8'

services:
  # ==========================================================================
  # Infrastructure Services (always needed)
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: eurocomply-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eurocomply
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:15-alpine
    container_name: eurocomply-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eurocomply_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eurocomply-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # walt.id SSI Kit (DID/VC Operations)
  waltid:
    image: waltid/ssikit:latest
    container_name: eurocomply-waltid
    command: serve -b 0.0.0.0
    ports:
      - '7000:7000'  # Core API (DID operations)
      - '7001:7001'  # Signatory (VC signing)
      - '7002:7002'  # Custodian (Key management)
      - '7003:7003'  # Auditor (VC verification)
    volumes:
      - waltid_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:7000/v1/did']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    profiles:
      - full
      - waltid

  # ==========================================================================
  # Application Services (for testing Docker build locally)
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eurocomply-api
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eurocomply?schema=public
      REDIS_URL: redis://redis:6379
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-test_clerk_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    profiles:
      - full  # Only runs with: docker-compose --profile full up

volumes:
  postgres_data:
  waltid_data:
