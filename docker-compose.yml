version: '3.8'

services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: eurocomply-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eurocomply
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eurocomply-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: eurocomply-adminer
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  # walt.id SSI Kit (DID/VC Operations)
  waltid:
    image: waltid/ssikit:latest
    container_name: eurocomply-waltid
    command: serve -b 0.0.0.0
    ports:
      - '7000:7000'  # Core API (DID operations)
      - '7001:7001'  # Signatory (VC signing)
      - '7002:7002'  # Custodian (Key management)
      - '7003:7003'  # Auditor (VC verification)
    volumes:
      - waltid_data:/data
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:7000/v1/did']
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    profiles:
      - full
      - waltid

volumes:
  postgres_data:
  waltid_data:
