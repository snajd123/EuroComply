version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eurocomply-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eurocomply
      POSTGRES_PASSWORD: eurocomply
      POSTGRES_DB: eurocomply
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurocomply"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: eurocomply-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # walt.id Core API
  waltid-core:
    image: waltid/core-api:latest
    container_name: eurocomply-waltid-core
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - WALTID_DATA_ROOT=/data
    volumes:
      - waltid_data:/data

  # walt.id Signatory API
  waltid-signatory:
    image: waltid/signatory-api:latest
    container_name: eurocomply-waltid-signatory
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - WALTID_DATA_ROOT=/data
    volumes:
      - waltid_data:/data
    depends_on:
      - waltid-core

  # walt.id Custodian API
  waltid-custodian:
    image: waltid/custodian-api:latest
    container_name: eurocomply-waltid-custodian
    restart: unless-stopped
    ports:
      - "7002:7002"
    environment:
      - WALTID_DATA_ROOT=/data
    volumes:
      - waltid_data:/data
    depends_on:
      - waltid-core

  # walt.id Auditor API
  waltid-auditor:
    image: waltid/auditor-api:latest
    container_name: eurocomply-waltid-auditor
    restart: unless-stopped
    ports:
      - "7003:7003"
    environment:
      - WALTID_DATA_ROOT=/data
    volumes:
      - waltid_data:/data
    depends_on:
      - waltid-core

  # EuroComply API (for production)
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: eurocomply-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://eurocomply:eurocomply@postgres:5432/eurocomply?schema=public
      - REDIS_URL=redis://redis:6379
      - WALTID_CORE_API=http://waltid-core:7000
      - WALTID_SIGNATORY_API=http://waltid-signatory:7001
      - WALTID_CUSTODIAN_API=http://waltid-custodian:7002
      - WALTID_AUDITOR_API=http://waltid-auditor:7003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      waltid-core:
        condition: service_started
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  waltid_data:
