# Infrastructure Deployment - Staging
# Deploys Terraform changes to staging environment
#
# Trigger: Changes to staging terraform files or manual dispatch

name: Infrastructure - Staging

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/environments/staging/**'
      - 'infrastructure/terraform/modules/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/environments/staging/**'
      - 'infrastructure/terraform/modules/**'
  workflow_dispatch:

env:
  AWS_REGION: eusc-de-east-1
  TF_VERSION: "1.14.3"
  ENVIRONMENT: staging

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws-eusc:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python for Lambda builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Lambda packages
        run: |
          LAMBDA_DIR="${GITHUB_WORKSPACE}/infrastructure/lambda/rds-iam-setup"
          if [ -f "$LAMBDA_DIR/requirements.txt" ]; then
            echo "Building RDS IAM setup Lambda..."
            cd "$LAMBDA_DIR"
            rm -rf package lambda.zip /tmp/psycopg2-download
            pip download -r requirements.txt -d /tmp/psycopg2-download \
              --platform manylinux2014_x86_64 \
              --python-version 3.11 \
              --only-binary=:all: \
              --quiet
            mkdir -p package
            for whl in /tmp/psycopg2-download/*.whl; do
              unzip -q -o "$whl" -d package
            done
            cp index.py package/
            cd package && zip -r ../lambda.zip . -q -x "*.pyc" -x "__pycache__/*"
            rm -rf /tmp/psycopg2-download
            echo "Lambda package created"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="zitadel_instance_url=${{ secrets.ZITADEL_INSTANCE_URL }}" \
            -var="zitadel_webhook_signing_key=${{ secrets.ZITADEL_WEBHOOK_SIGNING_KEY }}" \
            2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infrastructure/terraform/environments/staging/plan_output.txt', 'utf8');
            const output = `#### Terraform Plan - Staging

            **Format:** \`${{ steps.fmt.outcome }}\` | **Init:** \`${{ steps.init.outcome }}\` | **Validate:** \`${{ steps.validate.outcome }}\` | **Plan:** \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput.substring(0, 65000)}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve tfplan

      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: infrastructure/terraform/environments/staging/tfplan
          retention-days: 7
