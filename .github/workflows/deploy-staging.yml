# Deploy to Staging - AWS European Sovereign Cloud
# Builds Docker image, pushes to ECR, deploys to ECS, runs migrations and E2E tests
#
# Trigger: Changes to app code or manual dispatch

name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

env:
  AWS_REGION: eusc-de-east-1
  ECR_REPOSITORY: eurocomply-api
  ECS_CLUSTER: eurocomply-staging-cluster
  ECS_SERVICE: eurocomply-staging-api
  ECS_TASK_FAMILY: eurocomply-staging-api
  CONTAINER_NAME: api

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging  # Uses staging environment secrets

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN uses aws-eusc partition - account ID from secret
          role-to-assume: arn:aws-eusc:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Set ECR Registry
        id: ecr-registry
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.eu"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      - name: Configure AWS CLI for Sovereign Cloud
        run: |
          # Configure endpoints for AWS European Sovereign Cloud
          aws configure set region ${{ env.AWS_REGION }}

          # Set Sovereign Cloud endpoints (amazonaws.eu domain)
          cat >> ~/.aws/config << EOF

          [profile default]
          region = ${{ env.AWS_REGION }}
          services = sovereign-cloud

          [services sovereign-cloud]
          ecs =
            endpoint_url = https://ecs.${{ env.AWS_REGION }}.amazonaws.eu
          ecr =
            endpoint_url = https://ecr.${{ env.AWS_REGION }}.amazonaws.eu
          sts =
            endpoint_url = https://sts.${{ env.AWS_REGION }}.amazonaws.eu
          EOF

      - name: Login to Amazon ECR (Sovereign Cloud)
        id: login-ecr
        run: |
          # ECR login for Sovereign Cloud
          aws ecr get-login-password \
            --region ${{ env.AWS_REGION }} \
            --endpoint-url https://api.ecr.${{ env.AWS_REGION }}.amazonaws.eu \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get current task definition
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            > task-definition.json

          # Remove fields that can't be in a new registration
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > clean-task-definition.json

      - name: Update task definition with new image
        id: update-task-def
        run: |
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          jq --arg IMAGE "$NEW_IMAGE" --arg CONTAINER "${{ env.CONTAINER_NAME }}" \
            '.containerDefinitions |= map(if .name == $CONTAINER then .image = $IMAGE else . end)' \
            clean-task-definition.json > updated-task-definition.json

          echo "Updated image to: $NEW_IMAGE"

      - name: Register new task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://updated-task-definition.json \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered task definition: $TASK_DEF_ARN"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
            --force-new-deployment \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu

      - name: Wait for deployment
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu
          echo "Service is stable!"

      - name: Get ALB DNS name
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names eurocomply-staging-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --endpoint-url https://elasticloadbalancing.${{ env.AWS_REGION }}.amazonaws.eu)
          echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
          echo "ALB DNS: $ALB_DNS"

      - name: Run Database Migrations
        run: |
          echo "Running Prisma database migrations..."

          # Get migration task definition ARN
          MIGRATION_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_CLUSTER }}-migration \
            --query 'taskDefinition.taskDefinitionArn' \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            --output text 2>/dev/null || echo "")

          if [ -z "$MIGRATION_TASK_DEF" ]; then
            echo "Migration task definition not found, skipping migrations"
            exit 0
          fi

          # Get network configuration from the service
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            --query 'services[0].networkConfiguration' \
            --output json)

          # Run migration task
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition $MIGRATION_TASK_DEF \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task started: $TASK_ARN"
          aws ecs wait tasks-stopped \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu

          # Check exit code
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "Migrations completed successfully"

      - name: Verify Health
        run: |
          STAGING_URL="https://api-staging.eurocomply.eu"
          echo "Verifying application health at $STAGING_URL"

          sleep 30  # Wait for LB health checks

          for i in {1..10}; do
            echo "Attempt $i/10..."
            RESPONSE=$(curl -s -k "${STAGING_URL}/health/ready" || echo '{"status":"error"}')
            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed!"
              echo "$RESPONSE" | jq .
              break
            fi

            echo "Status: $STATUS - waiting 15s..."
            sleep 15
          done

          if [ "$STATUS" != "ok" ]; then
            echo "Health check failed after 10 attempts"
            exit 1
          fi

      - name: Run E2E Smoke Tests
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_TEST_USER_ID: ${{ secrets.E2E_TEST_USER_ID }}
        run: |
          export API_URL="https://api-staging.eurocomply.eu"

          # Generate E2E test token if configured
          if [ -n "$E2E_TEST_USER_ID" ] && [ -n "$CLERK_SECRET_KEY" ]; then
            chmod +x scripts/get-e2e-token.sh
            export E2E_TEST_TOKEN=$(./scripts/get-e2e-token.sh 2>/dev/null) || true
          fi

          # Run smoke tests
          chmod +x scripts/e2e-smoke-test.sh
          ./scripts/e2e-smoke-test.sh

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://api-staging.eurocomply.eu" >> $GITHUB_STEP_SUMMARY
