# Deploy to Staging - AWS European Sovereign Cloud
# Triggered on push to main branch after CI passes
# Builds Docker image, pushes to ECR, and deploys to ECS

name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

env:
  # AWS European Sovereign Cloud (eusc-de-east-1)
  AWS_REGION: eusc-de-east-1
  AWS_ACCOUNT_ID: "075285241396"
  # Sovereign Cloud uses amazonaws.eu domain
  ECR_REGISTRY: 075285241396.dkr.ecr.eusc-de-east-1.amazonaws.eu
  ECR_REPOSITORY: eurocomply-api
  ECS_CLUSTER: eurocomply-staging-cluster
  ECS_SERVICE: eurocomply-staging-api
  ECS_TASK_FAMILY: eurocomply-staging-api
  CONTAINER_NAME: api

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only run if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write  # For OIDC authentication
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN uses aws-eusc partition
          role-to-assume: arn:aws-eusc:iam::075285241396:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS CLI for Sovereign Cloud
        run: |
          # Configure endpoints for AWS European Sovereign Cloud
          aws configure set region ${{ env.AWS_REGION }}

          # Set Sovereign Cloud endpoints (amazonaws.eu domain)
          cat >> ~/.aws/config << EOF

          [profile default]
          region = ${{ env.AWS_REGION }}
          services = sovereign-cloud

          [services sovereign-cloud]
          ecs =
            endpoint_url = https://ecs.${{ env.AWS_REGION }}.amazonaws.eu
          ecr =
            endpoint_url = https://ecr.${{ env.AWS_REGION }}.amazonaws.eu
          sts =
            endpoint_url = https://sts.${{ env.AWS_REGION }}.amazonaws.eu
          EOF

      - name: Login to Amazon ECR (Sovereign Cloud)
        id: login-ecr
        run: |
          # ECR login for Sovereign Cloud
          aws ecr get-login-password \
            --region ${{ env.AWS_REGION }} \
            --endpoint-url https://api.ecr.${{ env.AWS_REGION }}.amazonaws.eu \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

          echo "registry=${{ env.ECR_REGISTRY }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get current task definition
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_FAMILY }} \
            --query 'taskDefinition' \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            > task-definition.json

          # Remove fields that can't be in a new registration
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > clean-task-definition.json

      - name: Update task definition with new image
        id: update-task-def
        run: |
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"

          jq --arg IMAGE "$NEW_IMAGE" --arg CONTAINER "${{ env.CONTAINER_NAME }}" \
            '.containerDefinitions |= map(if .name == $CONTAINER then .image = $IMAGE else . end)' \
            clean-task-definition.json > updated-task-definition.json

          echo "Updated image to: $NEW_IMAGE"

      - name: Register new task definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://updated-task-definition.json \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered task definition: $TASK_DEF_ARN"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.register-task-def.outputs.task_def_arn }} \
            --force-new-deployment \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu

      - name: Wait for deployment
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --endpoint-url https://ecs.${{ env.AWS_REGION }}.amazonaws.eu
          echo "Service is stable!"

      - name: Run smoke tests
        continue-on-error: true  # Don't fail deployment if smoke tests fail (network isolation)
        run: |
          STAGING_URL="${{ secrets.STAGING_API_URL }}"

          if [ -z "$STAGING_URL" ]; then
            echo "STAGING_API_URL not set, skipping smoke tests"
            exit 0
          fi

          echo "Running smoke tests against $STAGING_URL"

          # Health check with retries
          for i in {1..5}; do
            if curl -sf "${STAGING_URL}/health"; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed, waiting..."
            sleep 10
          done

          echo "Smoke tests failed - this may be due to network isolation from GitHub runners"
          echo "Verify manually: curl $STAGING_URL/health"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment to staging failed!"
          echo "Check the logs above for details"
          # Add Slack/Discord notification here if needed
