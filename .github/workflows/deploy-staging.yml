# Deploy to Staging
# Triggered on push to main branch after CI passes
# Builds Docker image, pushes to ECR, and deploys to ECS

name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: eurocomply-api
  ECS_CLUSTER: eurocomply-staging
  ECS_SERVICE: eurocomply-api

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only run if CI passed
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write  # For OIDC authentication
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:staging
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS
        run: |
          # Update ECS service to use new image
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Run smoke tests
        run: |
          # Get the ALB URL from ECS service
          STAGING_URL="${{ secrets.STAGING_API_URL }}"

          # Health check
          curl -f "${STAGING_URL}/health" || exit 1

          echo "Smoke tests passed!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment to staging failed!"
          # Add Slack/Discord notification here if needed
