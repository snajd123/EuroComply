# Terraform Infrastructure - AWS European Sovereign Cloud
# Runs terraform plan on PRs, terraform apply on merge to main

name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  # AWS European Sovereign Cloud (eusc-de-east-1)
  AWS_REGION: eusc-de-east-1
  TF_VERSION: "1.14.3"

jobs:
  terraform-staging:
    name: Terraform Staging
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # For OIDC authentication
      contents: read
      pull-requests: write  # For PR comments

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN uses aws-eusc partition - account ID from secret
          role-to-assume: arn:aws-eusc:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python for Lambda builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Lambda packages
        run: |
          # Build RDS IAM setup Lambda with Python 3.11 dependencies (Lambda runtime version)
          LAMBDA_DIR="${GITHUB_WORKSPACE}/infrastructure/lambda/rds-iam-setup"
          if [ -f "$LAMBDA_DIR/requirements.txt" ]; then
            echo "Building RDS IAM setup Lambda..."
            cd "$LAMBDA_DIR"
            rm -rf package lambda.zip /tmp/psycopg2-download

            # Download dependencies for Python 3.11 (must match Lambda runtime)
            pip download -r requirements.txt -d /tmp/psycopg2-download \
              --platform manylinux2014_x86_64 \
              --python-version 3.11 \
              --only-binary=:all: \
              --quiet

            # Extract wheel files
            mkdir -p package
            for whl in /tmp/psycopg2-download/*.whl; do
              unzip -q -o "$whl" -d package
            done

            cp index.py package/
            cd package && zip -r ../lambda.zip . -q -x "*.pyc" -x "__pycache__/*"
            rm -rf /tmp/psycopg2-download

            echo "Lambda package created: $LAMBDA_DIR/lambda.zip"
            ls -la "$LAMBDA_DIR/lambda.zip"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Force Unlock Stale State Lock (if needed)
        run: |
          # Try to unlock stale lock from cancelled runs
          terraform force-unlock -force 26a06356-423e-15c2-da28-b98302a96eff 2>/dev/null || true
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}" \
            2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infrastructure/terraform/environments/staging/plan_output.txt', 'utf8');

            const output = `#### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput.substring(0, 65000)}
            \`\`\`

            </details>

            *Environment: Staging (AWS European Sovereign Cloud)*
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Import Existing HTTPS Listener (if needed)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          # Check if HTTPS listener already exists in AWS but not in Terraform state
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names eurocomply-staging-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            LISTENER_ARN=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query "Listeners[?Port==\`443\`].ListenerArn" \
              --output text 2>/dev/null || echo "")

            if [ -n "$LISTENER_ARN" ] && [ "$LISTENER_ARN" != "None" ]; then
              # Check if already in state
              if ! terraform state show 'module.alb.aws_lb_listener.https[0]' >/dev/null 2>&1; then
                echo "Importing existing HTTPS listener: $LISTENER_ARN"
                terraform import 'module.alb.aws_lb_listener.https[0]' "$LISTENER_ARN" || true
              else
                echo "HTTPS listener already in Terraform state"
              fi
            fi
          fi
        continue-on-error: true

      - name: Terraform Plan (refresh after import)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          terraform plan -no-color -out=tfplan \
            -var="clerk_secret_key=${{ secrets.CLERK_SECRET_KEY }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: terraform apply -auto-approve tfplan

      - name: Run Database Migrations
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Running Prisma database migrations..."

          # Get migration task details from Terraform outputs
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
          TASK_DEF=$(terraform output -raw migration_task_definition_arn)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          SECURITY_GROUP=$(terraform output -raw ecs_security_group_id)

          echo "Cluster: $CLUSTER_NAME"
          echo "Task Definition: $TASK_DEF"
          echo "Subnets: $SUBNETS"
          echo "Security Group: $SECURITY_GROUP"

          # Run the migration task
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task started: $TASK_ARN"

          # Wait for the task to complete
          echo "Waiting for migration task to complete..."
          aws ecs wait tasks-stopped --cluster "$CLUSTER_NAME" --tasks "$TASK_ARN"

          # Check the exit code
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          echo "Migration task exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "ERROR: Migration failed with exit code $EXIT_CODE"

            # Get the task ID for log stream name
            TASK_ID=$(echo "$TASK_ARN" | sed 's/.*\///')

            # Try to fetch logs for debugging
            echo "Fetching migration logs..."
            aws logs get-log-events \
              --log-group-name "/ecs/eurocomply-staging" \
              --log-stream-name "migration/migration/$TASK_ID" \
              --limit 100 \
              --query 'events[*].message' \
              --output text || echo "Could not fetch logs"

            exit 1
          fi

          echo "Database migrations completed successfully!"

      - name: Deploy Fresh ECS Tasks
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Forcing new ECS deployment to ensure fresh database connections..."

          CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
          SERVICE_NAME=$(terraform output -raw ecs_service_name)

          # Force new deployment
          aws ecs update-service \
            --cluster "$CLUSTER_NAME" \
            --service "$SERVICE_NAME" \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

          echo "Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME"

          echo "ECS deployment completed successfully!"

      - name: Verify Health
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Verifying application health..."

          ALB_DNS=$(terraform output -raw alb_dns_name)

          # Wait for ALB to route to new tasks
          sleep 10

          # Check health endpoint
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -k "https://$ALB_DNS/health/ready" || echo '{"status":"error"}')
            STATUS=$(echo "$RESPONSE" | jq -r '.status')

            echo "Health check attempt $i: $STATUS"

            if [ "$STATUS" = "ok" ]; then
              echo "Application is healthy!"
              echo "$RESPONSE" | jq .
              exit 0
            fi

            echo "Waiting 15 seconds before retry..."
            sleep 15
          done

          echo "ERROR: Health check failed after 5 attempts"
          echo "Response: $RESPONSE"
          exit 1

      - name: Run E2E Smoke Tests
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          echo "Running E2E smoke tests..."

          # Get API URL
          ALB_DNS=$(terraform output -raw alb_dns_name)
          export API_URL="https://$ALB_DNS"

          # Run the smoke test script
          chmod +x "${GITHUB_WORKSPACE}/scripts/e2e-smoke-test.sh"
          "${GITHUB_WORKSPACE}/scripts/e2e-smoke-test.sh"

      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: infrastructure/terraform/environments/staging/tfplan
          retention-days: 7

  # Production terraform job (only on main branch, with manual approval)
  # Skipped until production environment is created
  terraform-production:
    name: Terraform Production
    runs-on: ubuntu-latest
    needs: [terraform-staging]
    # Only run if production directory exists AND on main branch push
    if: false  # Disabled until production environment is created
    environment: production  # Requires manual approval

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN uses aws-eusc partition - account ID from secret
          role-to-assume: arn:aws-eusc:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
