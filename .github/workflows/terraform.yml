# Terraform Infrastructure - AWS European Sovereign Cloud
# Runs terraform plan on PRs, terraform apply on merge to main

name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'

env:
  # AWS European Sovereign Cloud (eusc-de-east-1)
  AWS_REGION: eusc-de-east-1
  TF_VERSION: "1.14.3"

jobs:
  terraform-staging:
    name: Terraform Staging
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # For OIDC authentication
      contents: read
      pull-requests: write  # For PR comments

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN uses aws-eusc partition
          role-to-assume: arn:aws-eusc:iam::075285241396:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python for Lambda builds
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Lambda packages
        run: |
          # Build RDS IAM setup Lambda
          LAMBDA_DIR="${GITHUB_WORKSPACE}/infrastructure/lambda/rds-iam-setup"
          if [ -f "$LAMBDA_DIR/requirements.txt" ]; then
            echo "Building RDS IAM setup Lambda..."
            cd "$LAMBDA_DIR"
            rm -rf package lambda.zip
            pip install -r requirements.txt -t package --platform manylinux2014_x86_64 --only-binary=:all: --quiet
            cp index.py package/
            cd package && zip -r ../lambda.zip . -q
            echo "Lambda package created: $LAMBDA_DIR/lambda.zip"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infrastructure/terraform/environments/staging/plan_output.txt', 'utf8');

            const output = `#### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput.substring(0, 65000)}
            \`\`\`

            </details>

            *Environment: Staging (AWS European Sovereign Cloud)*
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Import Existing HTTPS Listener (if needed)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Check if HTTPS listener already exists in AWS but not in Terraform state
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names eurocomply-staging-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' \
            --output text 2>/dev/null || echo "")

          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            LISTENER_ARN=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query "Listeners[?Port==\`443\`].ListenerArn" \
              --output text 2>/dev/null || echo "")

            if [ -n "$LISTENER_ARN" ] && [ "$LISTENER_ARN" != "None" ]; then
              # Check if already in state
              if ! terraform state show 'module.alb.aws_lb_listener.https[0]' >/dev/null 2>&1; then
                echo "Importing existing HTTPS listener: $LISTENER_ARN"
                terraform import 'module.alb.aws_lb_listener.https[0]' "$LISTENER_ARN" || true
              else
                echo "HTTPS listener already in Terraform state"
              fi
            fi
          fi
        continue-on-error: true

      - name: Terraform Plan (refresh after import)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: infrastructure/terraform/environments/staging/tfplan
          retention-days: 7

  # Production terraform job (only on main branch, with manual approval)
  # Skipped until production environment is created
  terraform-production:
    name: Terraform Production
    runs-on: ubuntu-latest
    needs: [terraform-staging]
    # Only run if production directory exists AND on main branch push
    if: false  # Disabled until production environment is created
    environment: production  # Requires manual approval

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws-eusc:iam::075285241396:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
