# Terraform Infrastructure - AWS European Sovereign Cloud
# Runs terraform plan on PRs, terraform apply on merge to main

name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'

env:
  # AWS European Sovereign Cloud (eusc-de-east-1)
  AWS_REGION: eusc-de-east-1
  TF_VERSION: "1.6.0"

jobs:
  terraform-staging:
    name: Terraform Staging
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # For OIDC authentication
      contents: read
      pull-requests: write  # For PR comments

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role ARN uses aws-eusc partition
          role-to-assume: arn:aws-eusc:iam::075285241396:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('infrastructure/terraform/environments/staging/plan_output.txt', 'utf8');

            const output = `#### Terraform Format and Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput.substring(0, 65000)}
            \`\`\`

            </details>

            *Environment: Staging (AWS European Sovereign Cloud)*
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Upload Plan Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: infrastructure/terraform/environments/staging/tfplan
          retention-days: 7

  # Production terraform job (only on main branch, with manual approval)
  terraform-production:
    name: Terraform Production
    runs-on: ubuntu-latest
    needs: [terraform-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # Requires manual approval

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: infrastructure/terraform/environments/production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for Sovereign Cloud
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws-eusc:iam::075285241396:role/github-actions-eurocomply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
