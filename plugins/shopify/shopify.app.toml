# EuroComply Shopify App Configuration
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration

name = "EuroComply DPP"
client_id = "" # Fill in after creating app in Partners Dashboard
application_url = "https://localhost:3000"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_orders,read_inventory"

[auth]
redirect_urls = [
  "https://localhost:3000/auth/callback",
  "https://localhost:3000/auth/shopify/callback",
  "https://localhost:3000/api/shopify/callback"
]

[webhooks]
api_version = "2024-01"

  [webhooks.subscriptions]
  topics = [
    "products/create",
    "products/update",
    "products/delete",
    "orders/create",
    "app/uninstalled"
  ]
  uri = "/api/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "" # Fill in your dev store URL

[app_proxy]
prefix = "/apps/eurocomply"
subpath = "dpp"
url = "/api/proxy"
